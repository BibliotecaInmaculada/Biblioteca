<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo a Web Biblioteca...</title>
    
    <!-- Redirección instantánea para navegadores modernos -->
    <meta http-equiv="refresh" content="0;url="https://www.appsheet.com/start/1dfe95c8-6fbd-4ec4-9aaf-e14af78cda1b">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Abriendo Web Biblioteca</h2>
        <p>Si la aplicación no se abre automáticamente en unos segundos, <a href="https://www.appsheet.com/start/1dfe95c8-6fbd-4ec4-9aaf-e14af78cda1b">haz clic aquí</a>.</p>
    </div>

    <!-- Redirección de respaldo por JavaScript -->
    <script>
        window.location.href = "https://www.appsheet.com/start/1dfe95c8-6fbd-4ec4-9aaf-e14af78cda1b";
    </script>
</body>
</html>
