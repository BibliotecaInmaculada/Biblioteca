<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca Parroquia Inmaculada</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <!-- Avisos (SweetAlert2) -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
      .spinner-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 2rem;
      }
    </style>
  </head>
  
  <body>
     <div class="container mt-4">
          <h1 class="fs-2 text-primary">Biblioteca Parroquia Inmaculada</h1>
          <h2 class="fs-4 text-secondary mb-4">Renovación Préstamo de Libros</h2>
          
          <!-- Contenedor Dinámico -->
          <div id="contenedorMensaje">
              <!-- Pantalla de carga inicial mientras consulta a Google Sheets -->
              <div class="spinner-container" id="cargando">
                  <div class="spinner-border text-primary" role="status"></div>
                  <p class="mt-2 text-muted">Buscando tu préstamo, por favor espera...</p>
              </div>
              <div id="contenidoWeb"></div>
          </div>
     </div>

     <!-- Bootstrap Bundle JS -->
     <script src="https://jsdelivr.net" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

     <script>
       // URL DE TU WEB APP DE GOOGLE APP SCRIPT (Se cambiará al publicar el script más adelante)
       const URL_API = "https://script.google.com/macros/s/AKfycbyVo8KXUVu4lA6hzwj3LCOTybn6ZIJBwfeZNO3_B3ySf9xDiijs70TBgAhkTNCpH2ZorA/exec";
       
       let filaPrestamo = 0;
       let columnaRenovacion = 0;

       // Al cargar la página, leemos el parámetro 'id' de la URL y consultamos al backend de Google
       document.addEventListener("DOMContentLoaded", function() {
           const urlParams = new URLSearchParams(window.location.search);
           const idPrestamo = urlParams.get('id');

           if (!idPrestamo) {
               mostrarError("Ha habido algún problema con la URL y no se ha encontrado el identificador de tu préstamo.");
               return;
           }

           // Llamada a la API de Google App Script para validar el préstamo de forma segura
           fetch(`${URL_API}?action=buscar&id=${idPrestamo}`)
               .then(response => response.json())
               .then(data => {
                   document.getElementById("cargando").style.display = "none";
                   
                   if (data.status === "error") {
                       mostrarError(data.message);
                       return;
                   }

                   // Guardamos las coordenadas de las celdas para cuando pulse el botón
                   filaPrestamo = data.fila;
                   columnaRenovacion = data.columna;

                   renderizarInterfaz(data);
               })
               .catch(error => {
                   document.getElementById("cargando").style.display = "none";
                   mostrarError("Error de conexión al buscar los datos: " + error);
               });
       });

       function renderizarInterfaz(data) {
           const contenedor = document.getElementById("contenidoWeb");
           
           if (data.tipoVista === "formulario") {
               contenedor.innerHTML = `
                  <div>
                    <p id="msgRenovacion"> Hola <strong>${data.lector}</strong>.<br>
                    Pulsa el botón para renovar el préstamo del libro: 
                    <strong> ${data.libro} </strong></p>
                  </div>
                  <br>
                  <div>
                     <button type="button" id="Boton" class="btn btn-secondary" onclick="enviarRenovacion()">Renovar Préstamo</button>
                  </div>
                  <br>
                  <div>
                     <p> Y si quieres devolver el libro llévalo a la Parroquia, déjalo sobre la siguiente bandeja negra:</p>
                     <!-- RUTA RELATIVA A TU CARPETA DE GITHUB FOTOS -->
                     <img src="../Fotos/Bandeja Negra.jpg" width="50%" alt="Bandeja negra de devoluciones"/>
                  </div>
                  <br>
                  <div>                    
                     <p> ... Cuando lo hayas dejado nos avisas. </p>
                  </div>`;
           } else if (data.tipoVista === "ya_renovado") {
               contenedor.innerHTML = `
                  <div>
                    <p> Hola <strong>${data.lector}</strong>.</p><br>
                    <p> La petición de renovación del libro: </p>
                  </div>
                  <div>
                    <p> <strong> ${data.libro} </strong></p>
                  </div>
                  <br>
                  <div>
                    <p> La completaste el <strong>${data.fechaRenovacion}</strong>. </p><br>
                    <p> Recuerda devolverlo tan pronto como termines de leerlo. </p>
                  </div>
                  <div>
                    <p> Ya has terminado, puedes cerrar esta página.</p>
                  </div>`;
           }
       }

       function enviarRenovacion() {
         const boton = document.getElementById("Boton");
         if (boton) boton.style.visibility = "hidden";

         // Enviamos la orden de escribir la fecha de renovación en el Google Sheets
         fetch(`${URL_API}?action=renovar&fila=${filaPrestamo}&columna=${columnaRenovacion}`)
           .then(response => response.json())
           .then(data => {
               if (data.status === "success") {
                   finalizar();
                   const msg = document.getElementById("msgRenovacion");
                   if (msg) {
                     msg.innerHTML = `
                       <br>
                       <div class="alert alert-success">
                         <p class="mb-0"><strong>¡Hecho!</strong> Ya has terminado, puedes cerrar esta página.<br>
                         Recuerda devolver el libro tan pronto como termines de leerlo.</p>
                       </div>`;
                   }
               } else {
                   if (boton) boton.style.visibility = "visible";
                   Swal.fire({ icon: 'error', title: 'Error', text: data.message });
               }
           })
           .catch(error => {
              if (boton) boton.style.visibility = "visible";
              Swal.fire({ icon: 'error', title: 'Error de conexión', text: 'No se pudo guardar la renovación: ' + error });
           });
       }
       
       function finalizar() {
         Swal.fire({
           icon: "success",
           title: "Se ha renovado el préstamo",
           text: "Muchas gracias y recuerda devolver el libro tan pronto como termines de leerlo",
           showConfirmButton: true,
           confirmButtonText: "Entendido",
           timer: 6000
         });
       }

       function mostrarError(mensaje) {
           document.getElementById("contenidoWeb").innerHTML = `
                <div class="alert alert-danger">
                  <p class="mb-0">${mensaje}</p>
                </div>
                <div>
                  <p class="mt-3 text-muted">Ya has terminado, puedes cerrar esta página.</p>
                </div>`;
       }
     </script>
  </body>
</html>
