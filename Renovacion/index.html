<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca Parroquia Inmaculada</title>

    <!-- Bootstrap 5 CSS (Servidor cdnjs Completo) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/css/bootstrap.min.css"
    <!-- Avisos (SweetAlert2) -->
     <script src="https://cdnjs.cloudflare.com/ajax/libs/limonte-sweetalert2/11.10.5/sweetalert2.all.min.js"></script>
    
    <style>
      body {
        background-color: #f4f6f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card-renovacion {
        width: 100%;
        max-width: 700px; /* Incrementado de 550px a 700px para que luzca perfecto en PC */
        margin: 3rem auto;
        background: #ffffff;
        border: none;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        padding: 3rem 2.5rem; /* Más espacio interno en ordenadores */
      }
      .spinner-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 200px;
      }
      .imagen-bandeja {
        width: 100%;
        max-width: 480px; /* La foto ahora aprovecha mejor el ancho en escritorio */
        height: auto;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin: 1.5rem auto;
        display: block;
      }
      .btn-renovar {
        background-color: #0d6efd;
        color: white;
        border: none;
        padding: 0.9rem 2rem;
        font-size: 1.15rem;
        font-weight: 600;
        border-radius: 10px;
        transition: all 0.2s ease;
        width: 100%;
      }
      .btn-renovar:hover {
        background-color: #0b5ed7;
        transform: translateY(-1px);
        color: white;
      }
      /* REGLA ESPECIAL: Ajustes automáticos cuando se use un móvil */
      @media (max-width: 768px) {
        .card-renovacion {
          margin: 1rem;
          padding: 1.8rem 1.4rem;
          max-width: calc(100% - 2rem);
        }
        h1 { font-size: 1.6rem !important; }
        h2 { font-size: 1.1rem !important; }
        .imagen-bandeja { max-width: 100%; }
        .btn-renovar { font-size: 1.1rem; padding: 0.8rem 2rem; }
      }
    </style>

  </head>
  
  <body>
     <div class="container">
          <div class="card-renovacion text-center">
              <!-- Cabecera unificada -->
              <h1 class="fs-3 text-primary fw-bold mb-1">Biblioteca Parroquia Inmaculada</h1>
              <h2 class="fs-5 text-muted mb-4">Renovación de Préstamos</h2>
              <hr class="text-muted opacity-25 mb-4">
              
              <!-- Contenedor Dinámico -->
              <div id="contenedorMensaje">
                  <!-- Pantalla de carga inicial móvil -->
                  <div class="spinner-container" id="cargando">
                      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                      <p class="mt-3 text-muted fw-medium">Buscando tu préstamo, por favor espera...</p>
                  </div>
                  <div id="contenidoWeb"></div>
              </div>
          </div>
     </div>

     <!-- Bootstrap Bundle JS (Servidor cdnjs Completo) -->
      <script src="src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.2/js/bootstrap.bundle.min.js"></script>
     <script>
       // URL DE TU WEB APP DE GOOGLE APP SCRIPT
       const URL_API = "https://script.google.com/macros/s/AKfycbwnBjOUlMUY62JVNzHSmEVdrlJaIA072ntMWgY6J0aZASe3DY3OrJ1EVvpvRrPK0duESA/exec";
       
       let filaPrestamo = 0;
       let columnaRenovacion = 0;

       document.addEventListener("DOMContentLoaded", function() {
           const urlParams = new URLSearchParams(window.location.search);
           const idPrestamo = urlParams.get('id');

           if (!idPrestamo) {
               mostrarError("Ha habido algún problema con la URL y no se ha encontrado el identificador de tu préstamo.");
               return;
           }

           fetch(`${URL_API}?action=buscar&id=${idPrestamo}`, {
               method: 'GET',
               mode: 'cors'
           })
           .then(response => {
               if (!response.ok) throw new Error("Error de red");
               return response.json();
           })
           .then(data => {
               document.getElementById("cargando").style.display = "none";
               
               if (data.status === "error") {
                   mostrarError(data.message);
                   return;
               }

               filaPrestamo = data.fila;
               columnaRenovacion = data.columna;
               renderizarInterfaz(data);
           })
           .catch(error => {
               document.getElementById("cargando").style.display = "none";
               mostrarError("Error al conectar con el servidor de la Biblioteca.");
           });
       });

       function renderizarInterfaz(data) {
           const contenedor = document.getElementById("contenidoWeb");
           
           if (data.tipoVista === "formulario") {
               contenedor.innerHTML = `
                  <div class="text-start mb-4">
                    <p class="fs-5 mb-3">Hola <strong>${data.lector}</strong>,</p>
                    <p class="text-secondary">Pulsa el botón inferior para confirmar la renovación del préstamo del libro:</p>
                    <div class="p-3 bg-light border-start border-primary border-4 rounded mb-4">
                        <span class="text-muted small d-block">Título del libro</span>
                        <strong class="fs-5 text-dark">${data.libro}</strong>
                    </div>
                  </div>
                  
                  <div class="mb-4">
                     <button type="button" id="Boton" class="btn btn-renovar shadow-sm" onclick="enviarRenovacion()">Confirmar Renovación</button>
                  </div>
                  
                  <hr class="text-muted opacity-25 my-4">
                  
                  <div class="text-start text-secondary small">
                     <p class="fw-bold text-dark mb-2">📌 ¿Quieres devolverlo?</p>
                     <p class="mb-2">Llévalo a la Parroquia y déjalo sobre la siguiente <strong>bandeja negra</strong>:</p>
                     <img src="../Fotos/Bandeja Negra.jpg" class="imagen-bandeja" alt="Bandeja negra de devoluciones"/>
                     <p class="mt-3 text-center text-muted italic">... Cuando lo hayas dejado nos avisas.</p>
                  </div>`;
           } else if (data.tipoVista === "ya_renovado") {
               contenedor.innerHTML = `
                  <div class="text-start">
                    <p class="fs-5">Hola <strong>${data.lector}</strong>,</p>
                    <div class="alert alert-info border-0 rounded-3 p-3 mb-4">
                        La petición de renovación para el libro <strong>"${data.libro}"</strong> ya la completaste el día <strong>${data.fechaRenovacion}</strong>.
                    </div>
                    <p class="text-muted small">Recuerda devolverlo tan pronto como termines de leerlo para que otros feligreses puedan disfrutarlo.</p>
                  </div>
                  <div class="mt-4">
                    <p class="text-primary fw-medium small">Ya has terminado, puedes cerrar esta página.</p>
                  </div>`;
           }
       }

       function enviarRenovacion() {
         const boton = document.getElementById("Boton");
         if (boton) boton.style.visibility = "hidden";

         fetch(`${URL_API}?action=renovar&fila=${filaPrestamo}&columna=${columnaRenovacion}`)
           .then(response => response.json())
           .then(data => {
               if (data.status === "success") {
                   finalizar();
                   document.getElementById("contenidoWeb").innerHTML = `
                       <div class="alert alert-success border-0 rounded-3 p-4 text-start">
                         <h4 class="alert-heading fw-bold fs-5 mb-2">¡Todo listo!</h4>
                         <p class="mb-0 small">La renovación se ha guardado en el sistema correctamente.<br><br>
                         Recuerda devolver el libro tan pronto como termines de leerlo. ¡Muchas gracias!</p>
                       </div>
                       <p class="mt-4 text-muted small">Puedes cerrar esta página de forma segura.</p>`;
               } else {
                   if (boton) boton.style.visibility = "visible";
                   
                   // Limpiamos los textos técnicos de zona horaria si vienen de Google Sheets
                   let mensajeLimpio = data.message;
                   if (mensajeLimpio.includes("GMT")) {
                       mensajeLimpio = mensajeLimpio.split(" GMT")[0] + ").";
                   }

                   Swal.fire({ 
                     icon: 'error', 
                     title: 'Aviso del Sistema', 
                     text: mensajeLimpio, 
                     confirmButtonColor: '#0d6efd',
                     confirmButtonText: 'Entendido',
                     customClass: {
                       confirmButton: 'px-4 py-2 rounded-3 fw-bold'
                     }
                   });
               }

       
       function finalizar() {
         Swal.fire({
           icon: "success",
           title: "¡Préstamo Renovado!",
           text: "Muchas gracias. Recuerda devolver el libro tan pronto como termines de leerlo.",
           showConfirmButton: true,
           confirmButtonText: "Entendido",
           confirmButtonColor: "#0d6efd",
           customClass: {
             confirmButton: 'px-4 py-2 rounded-3 fw-bold'
           },
           buttonsStyling: true
         });
       }


       function mostrarError(mensaje) {
           document.getElementById("contenidoWeb").innerHTML = `
                <div class="alert alert-danger border-0 rounded-3 text-start p-3">
                  <p class="mb-0 small fw-medium">${mensaje}</p>
                </div>
                <p class="mt-4 text-muted small">Puedes cerrar esta página.</p>`;
       }
     </script>
  </body>
</html>
