<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Parroquial - Renovación Online</title>
    <!-- Bootstrap para la pantalla de carga limpia -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }
        .pantalla-espera {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1e3d59;
        }
    </style>
</head>
<body>

    <!-- Indicador de carga estético -->
    <div id="pantalla-carga" class="pantalla-espera">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <div class="mt-3 fw-bold fs-5">Conectando con la Biblioteca Parroquial...</div>
        <div class="text-muted small">Por favor, espera un momento mientras cargamos tu préstamo.</div>
    </div>

    <script>
        try {
            // 1. Extraer el ID dinámico de la URL de GitHub
            var urlCompleta = window.location.href;
            var posicionId = urlCompleta.indexOf("?id=");
            var idPrestamo = "";
            
            if (posicionId !== -1) {
                var idExtraido = urlCompleta.substring(posicionId + 4);
                idPrestamo = idExtraido.substring(0, 12);
            }

            // 2. Si el ID es correcto, saltamos directamente a Google Apps Script
            if (idPrestamo && idPrestamo.length === 12) {
                
                // TRUCO: Añadimos "&output=embed" al final de tu URL. 
                // Esto fuerza a Google a renderizar la web limpia y sin el banner azul superior.
                 var urlScriptGoogle ="https://script.google.com/macros/s/AKfycbz4FNaVDdKDU_wveSctaPkc8SrMPSNrtueFAnbE-rQX-FWEy_qWWFqmh8XwxThe_44TAg/exec?id=" + idPrestamo
+ "&output=embed";
                
                // Redirección directa de la pestaña (Elimina el error de Google Drive en móviles)
                window.location.replace(urlScriptGoogle);

            } else {
                document.getElementById("pantalla-carga").innerHTML = 
                    '<div class="text-center p-4">' +
                    '<h2 class="text-danger fw-bold">⚠️ Enlace inválido</h2>' +
                    '<p class="text-muted">No se ha detectado el código del préstamo. Por favor, utiliza el enlace completo de WhatsApp.</p>' +
                    '</div>';
            }
        } catch (error) {
            document.getElementById("pantalla-carga").innerHTML = 
                '<div class="text-center p-4"><p class="text-danger">Error de redirección: ' + error.message + '</p></div>';
        }
    </script>
</body>
</html>
