<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Parroquial - Renovación Online</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }
        .mensaje-carga {
            text-align: center;
            padding-top: 50px;
            color: #1e3d59;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="pantalla-carga" class="mensaje-carga">Conectando de forma segura con el sistema de la biblioteca...</div>

    <script>
        try {
            // 1. El mismo método exacto que acabamos de validar con éxito
            var urlCompleta = window.location.href;
            var posicionId = urlCompleta.indexOf("?id=");
            var idPrestamo = "";
            
            if (posicionId !== -1) {
                var idExtraido = urlCompleta.substring(posicionId + 4);
                idPrestamo = idExtraido.substring(0, 12);
            }

            // 2. Si el ID es correcto (12 caracteres), inyectamos tu script estable de Google
            if (idPrestamo && idPrestamo.length === 12) {
                // Ocultamos el mensaje de carga
                document.getElementById("pantalla-carga").style.display = "none";

                // Tu URL de producción de Google Apps Script 100% estable    
                 var urlScriptGoogle ="https://script.google.com/macros/s/AKfycbwhJ2VUAjQx2lau2g40BMmtrQdhsy7K7rN_RwcEeNTfV0Lwweo4LMMzLPGyRgnz2Va0Ug/exec?id=" + idPrestamo;
               // var urlScriptGoogle ="https://script.google.com/macros/s/AKfycbwhJ2VUAjQx2lau2g40BMmtrQdhsy7K7rN_RwcEeNTfV0Lwweo4LMMzLPGyRgnz2Va0Ug/exec?id=26003115800G"
                // Creamos el marco que ocupará toda la pantalla de forma limpia
                var iframe = document.createElement('iframe');
                iframe.src = urlScriptGoogle;
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "none";
                
                document.body.appendChild(iframe);
            } else {
                document.getElementById("pantalla-carga").innerHTML = 
                    '<p style="color:#d9534f; font-weight:bold; font-size:1.5rem;">⚠️ Enlace inválido</p>' +
                    '<p style="font-size:1rem; color:#6c757d;">No se ha detectado el código del préstamo en la URL. Por favor, utiliza el enlace completo de WhatsApp.</p>';
            }
        } catch (error) {
            document.getElementById("pantalla-carga").innerHTML = 
                '<p style="color:#d9534f;">Error de lectura en el navegador. Por favor, refresque la página.</p>';
        }
    </script>
</body>
</html>
