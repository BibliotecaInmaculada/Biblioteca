<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Parroquial - Renovación Online</title>
    <!-- Cargamos Bootstrap únicamente para usar sus estilos de carga limpios -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }
        .pantalla-espera {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1e3d59;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

    <!-- Indicador de carga estético y profesional -->
    <div id="pantalla-carga" class="pantalla-espera">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
        <div class="mt-3 fw-bold fs-5">Conectando con la Biblioteca Parroquial...</div>
        <div class="text-muted small">Por favor, espera un momento.</div>
    </div>

    <script>
        try {
            // 1. Extraer el ID dinámico de la barra de direcciones de forma limpia
            var urlCompleta = window.location.href;
            var posicionId = urlCompleta.indexOf("?id=");
            var idPrestamo = "";
            
            if (posicionId !== -1) {
                var idExtraido = urlCompleta.substring(posicionId + 4);
                idPrestamo = idExtraido.substring(0, 12);
            }

            // 2. Si el ID es válido, fabricamos el marco e interceptamos su carga
            if (idPrestamo && idPrestamo.length === 12) {
                // Tu URL de producción de Google Apps Script unificada y estable
                var urlScriptGoogle ="https://script.google.com/a/~/macros/s/AKfycbz4FNaVDdKDU_wveSctaPkc8SrMPSNrtueFAnbE-rQX-FWEy_qWWFqmh8XwxThe_44TAg/exec?id=" + idPrestamo
+ "&output=embed";
                var iframe = document.createElement('iframe');
                iframe.src = urlScriptGoogle;
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "none";
                iframe.style.display = "none"; // Lo mantenemos oculto mientras descarga
                
                // TRUCO DE FLUIDEZ: Cuando el contenido de Google esté 100% cargado, hacemos el cambio
                iframe.onload = function() {
                    document.getElementById("pantalla-carga").style.display = "none"; // Oculta el spinner
                    iframe.style.display = "block"; // Muestra la biblioteca de golpe
                };
                
                document.body.appendChild(iframe);
            } else {
                document.getElementById("pantalla-carga").innerHTML = 
                    '<div class="text-center p-4">' +
                    '<h2 class="text-danger fw-bold">⚠️ Enlace inválido</h2>' +
                    '<p class="text-muted">No se ha detectado el código del préstamo. Por favor, utiliza el enlace completo de WhatsApp.</p>' +
                    '</div>';
            }
        } catch (error) {
            document.getElementById("pantalla-carga").innerHTML = 
                '<div class="text-center p-4"><p class="text-danger">Error de carga: ' + error.message + '</p></div>';
        }
    </script>
</body>
</html>
