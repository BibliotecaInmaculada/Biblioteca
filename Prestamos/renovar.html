    <script>
        try {
            // 1. Extraer el ID directamente de la barra de direcciones de forma limpia
            var urlCompleta = window.location.href;
            var idPrestamo = "";

            if (urlCompleta.indexOf("?id=") !== -1) {
                var partes = urlCompleta.split("?id=");
                if (partes.length > 1) {
                    // CORREGIDO: Aplicamos el corte sobre el texto limpio (partes[1]) y no sobre la lista
                    var idExtraido = partes[1].trim();
                    idPrestamo = idExtraido.substring(0, 12);
                }
            }

            // 2. Si el ID es correcto (12 caracteres), fabricamos el marco invisible
            if (idPrestamo && idPrestamo.length === 12) {
                // Ocultamos el mensaje de carga
                document.getElementById("pantalla-carga").style.display = "none";

                // Tu URL de producción de Google Apps Script 100% estable
                var urlScriptGoogle = "https://google.com" + idPrestamo;

                // Creamos el iframe que ocupará toda la pantalla
                var iframe = document.createElement('iframe');
                iframe.src = urlScriptGoogle;
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "none";
                
                document.body.appendChild(iframe);
            } else {
                document.getElementById("pantalla-carga").innerHTML = 
                    '<p style="color:#d9534f; font-weight:bold; font-size:1.5rem;">⚠️ Enlace inválido</p>' +
                    '<p style="font-size:1rem; color:#6c757d;">No se ha detectado el código del préstamo en la URL. Por favor, utiliza el enlace completo de WhatsApp.</p>';
            }
        } catch (error) {
            document.getElementById("pantalla-carga").innerHTML = 
                '<p style="color:#d9534f;">Error de lectura en el navegador. Por favor, refresque la página.</p>';
        }
    </script>
