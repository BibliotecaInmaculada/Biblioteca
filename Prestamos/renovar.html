<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Parroquial - Renovación Online</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }
        .mensaje-carga {
            text-align: center;
            padding-top: 50px;
            color: #1e3d59;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="pantalla-carga" class="mensaje-carga">Conectando de forma segura con el sistema de la biblioteca...</div>

    <script>
        // 1. Capturar los parámetros de la URL de la barra de direcciones de GitHub Pages
        const urlParams = new URLSearchParams(window.location.search);
        const idPrestamo = urlParams.get('id');

        // 2. Si el ID existe y es correcto (12 caracteres), inyectamos tu script estable de Google
        if (idPrestamo && idPrestamo.length === 12) {
            // Ocultamos el texto de carga inicial
            document.getElementById("pantalla-carga").style.display = "none";

            // Tu URL de producción de Google Apps Script (la versión 100% estable que recuperamos)
            const urlScriptGoogle = "https://google.com" + idPrestamo;

            // Creamos el marco (Iframe) que ocupará toda la pantalla y camuflará el banner gris superior
            const iframe = document.createElement('iframe');
            iframe.src = urlScriptGoogle;
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            
            document.body.appendChild(iframe);
        } else {
            // Protección anticaídas si alguien entra al enlace corrupto o sin el id
            document.getElementById("pantalla-carga").innerHTML = `
                <p style="color:#d9534f; font-weight:bold; font-size:1.5rem;">⚠️ Enlace inválido</p>
                <p style="font-size:1rem; color:#6c757d;">No se ha detectado el código del préstamo en la URL. Por favor, asegúrate de abrir el enlace completo que has recibido por WhatsApp.</p>
            `;
        }
    </script>
</body>
</html>
