<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Parroquial - Renovación Online</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }
        .mensaje-carga {
            text-align: center;
            padding-top: 50px;
            color: #1e3d59;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 🖥️ TRUCO MAESTRO: El iframe ocupa todo el alto, pero limitamos su ancho máximo en PC */
        .iframe-centrado {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Oculto durante la carga */
        }

        /* Si es una computadora (pantallas grandes), estrechamos el iframe y lo centramos horizontalmente */
        @media (min-width: 768px) {
            .iframe-centrado {
                max-width: 700px; /* Ancho ideal de lectura tipo tarjeta */
                margin: 0 auto;   /* Centra el iframe perfectamente en medio de la pantalla */
                box-shadow: 0 0 20px rgba(0,0,0,0.05); /* Sutil sombra a los lados */
                background-color: #ffffff;
            }
        }
    </style>
</head>
<body>

    <div id="pantalla-carga" class="mensaje-carga">Conectando de forma segura con el sistema de la biblioteca...</div>

    <script>
        try {
            // 1. Extracción limpia de tu ID dinámico de WhatsApp
            var urlCompleta = window.location.href;
            var posicionId = urlCompleta.indexOf("?id=");
            var idPrestamo = "";
            
            if (posicionId !== -1) {
                var idExtraido = urlCompleta.substring(posicionId + 4);
                idPrestamo = idExtraido.substring(0, 12);
            }

            // 2. Si el ID es correcto, inyectamos el iframe elástico
            if (idPrestamo && idPrestamo.length === 12) {
                
                // Tu URL de producción estable
                   var urlScriptGoogle = "https://script.google.com/macros/s/AKfycbzy_5uOsH0cpG9G6Vmw0G1UxMIvLnbNtIxQPuWqbU_iYLjzEvgqUuXXRoX30BRy_maehQ/exec?id=" + idPrestamo + "&output=embed";
                //var urlScriptGoogle ="https://script.google.com/a/~/macros/s/AKfycbz4FNaVDdKDU_wveSctaPkc8SrMPSNrtueFAnbE-rQX-FWEy_qWWFqmh8XwxThe_44TAg/exec?id=" + idPrestamo;
//+ "&output=embed";
                
                var iframe = document.createElement('iframe');
                iframe.src = urlScriptGoogle;
                iframe.className = "iframe-centrado"; // Aplicamos nuestra clase elástica
                
                // En cuanto Google responde, el intercambio visual es instantáneo
                iframe.onload = function() {
                    document.getElementById("pantalla-carga").style.display = "none"; 
                    iframe.style.display = "block"; 
                };
                
                document.body.appendChild(iframe);
            } else {
                document.getElementById("pantalla-carga").innerHTML = 
                    '<p style="color:#d9534f; font-weight:bold; font-size:1.5rem;">⚠️ Enlace inválido</p>' +
                    '<p style="font-size:1rem; color:#6c757d;">No se ha detectado el código del préstamo. Por favor, utiliza el enlace completo de WhatsApp.</p>';
            }
        } catch (error) {
            document.getElementById("pantalla-carga").innerHTML = 
                '<p style="color:#d9534f;">Error de lectura en el navegador. Por favor, refresque la página.</p>';
        }
    </script>
</body>
</html>
