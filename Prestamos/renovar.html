<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Parroquial - Renovación Online</title>
    <!-- Cargamos Bootstrap únicamente para la maquetación exterior y la pantalla de carga -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f9fa;
            font-family: sans-serif;
        }

        /* DISEÑO DE ESCRITORIO (PC): Centra el bloque del iframe en forma de tarjeta elegante */
        .contenedor-marco-seguro {
            width: 100%;
            height: 100%;
            display: none; /* Se activa dinámicamente mediante JS */
            box-sizing: border-box;
        }

        /* Pantalla de carga estética */
        .pantalla-espera {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #1e3d59;
            background-color: #f8f9fa;
        }

        /* ======================================================= */
        /* 🖥️ CONFIGURACIÓN EXCLUSIVA PARA PC (Pantallas grandes)  */
        /* ======================================================= */
        @media (min-width: 768px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 0;
            }
            .contenedor-marco-seguro {
                max-width: 700px;    /* Ancho de tarjeta generoso y legible en PC */
                max-height: 850px;   /* Altura límite para que no se deforme en monitores */
                height: 100%;
                background: #ffffff;
                border-radius: 12px;
                box-shadow: 0 4px 25px rgba(0,0,0,0.06); /* Sutil sombra profesional */
                overflow: hidden;    /* Mantiene las esquinas de Google redondeadas */
            }
        }
    </style>
</head>
<body>

    <!-- Indicador de carga centrado profesionalmente -->
    <div id="pantalla-carga" class="pantalla-espera">
        <div class="text-center p-4">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <div class="mt-3 fw-bold fs-5">Conectando de forma segura con la biblioteca...</div>
            <div class="text-muted small">Por favor, espera un momento.</div>
        </div>
    </div>

    <!-- Contenedor exterior que se encarga de centrar la interfaz de Google en PC -->
    <div id="wrapper-seguro" class="contenedor-marco-seguro"></div>

    <script>
        try {
            // 1. Extracción del ID dinámico de la barra de direcciones de WhatsApp
            var urlCompleta = window.location.href;
            var posicionId = urlCompleta.indexOf("?id=");
            var idPrestamo = "";
            
            if (posicionId !== -1) {
                var idExtraido = urlCompleta.substring(posicionId + 4);
                idPrestamo = idExtraido.substring(0, 12);
            }

            // Para tus pruebas locales fijas, puedes descomentar la siguiente línea:
            // idPrestamo = "26003115800G";

            // 2. Si el ID es correcto, fabricamos el iframe y dejamos que GitHub lo centre en PC
            if (idPrestamo && idPrestamo.length === 12) {
                
                // Tu URL de producción con el parche multicuenta y el modo embed estables
                var urlScriptGoogle = "https://script.google.com/macros/s/AKfycbzy_5uOsH0cpG9G6Vmw0G1UxMIvLnbNtIxQPuWqbU_iYLjzEvgqUuXXRoX30BRy_maehQ/exec?id=" + idPrestamo + "&output=embed";
                //var urlScriptGoogle ="https://script.google.com/a/~/macros/s/AKfycbz4FNaVDdKDU_wveSctaPkc8SrMPSNrtueFAnbE-rQX-FWEy_qWWFqmh8XwxThe_44TAg/exec?id=" + idPrestamo;
//+ "&output=embed";
                var iframe = document.createElement('iframe');
                iframe.src = urlScriptGoogle;
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "none";
                
                // Cuando los servidores de Google terminen de responder, hacemos la transición visual
                iframe.onload = function() {
                    document.getElementById("pantalla-carga").style.display = "none"; // Oculta la carga
                    var contenedor = document.getElementById("wrapper-seguro");
                    contenedor.style.display = "block"; // Muestra el bloque centrado en PC y fluido en móvil
                };
                
                document.getElementById("wrapper-seguro").appendChild(iframe);

            } else {
                document.getElementById("pantalla-carga").innerHTML = 
                    '<div class="text-center p-4">' +
                    '<h2 class="text-danger fw-bold fs-4">⚠️ Enlace inválido</h2>' +
                    '<p class="text-muted mt-2">No se ha detectado el código del préstamo de forma correcta.</p>' +
                    '</div>';
            }
        } catch (error) {
            document.getElementById("pantalla-carga").innerHTML = 
                '<div class="text-center p-4"><p class="text-danger">Error de procesamiento: ' + error.message + '</p></div>';
        }
    </script>
</body>
</html>
